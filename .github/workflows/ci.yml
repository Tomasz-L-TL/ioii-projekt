name: Kontrola jakości

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - run: npm run db:generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run db:validate
      - run: npm run test
      - run: npm run build
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      # Runner tworzy bazę, sekret i osobne porty; bez ponownego użycia serwerów.
      # Nie przesyłamy trace/HAR ani innych artefaktów z poświadczeniami.
      - run: npm run test:e2e -- --engine=${{ matrix.browser }}
