    <rect x="264" y="558" width="974" height="102" rx="6" fill="#f2e9cc" stroke="#bdc9c1" />
    <text x="280" y="586" font-size="15" fill="#253d35">Historia anulowania — przykład: 18.10.2026, 12:00 Europe/Warsaw.</text>
    <text x="280" y="612" font-size="15" fill="#253d35">Inicjator anulowania: Administrator demo. Powód: dezaktywacja sali.</text>
    <text x="280" y="638" font-size="15" fill="#253d35">Zajętość: 60 min dla 45 min zajęć; 120 min dla 90 min zajęć.</text>
    <rect x="264" y="711" width="974" height="76" rx="6" fill="#f2e9cc" stroke="#bdc9c1" />
    <text x="280" y="739" font-size="15" fill="#253d35">Projekt potwierdzenia: anulować przyszłą aktywną rezerwację studenta?</text>
    <text x="280" y="765" font-size="15" fill="#253d35">Rozpoczęta / zakończona / już anulowana: brak akcji anulowania.</text>
    <rect x="264" y="823" width="320" height="40" rx="6" fill="#205c49" stroke="#bdc9c1" />
