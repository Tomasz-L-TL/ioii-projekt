    <text x="280" y="889" font-size="15" fill="#253d35">Projekty stanów: brak blokad / konflikt z inną blokadą / brak uprawnień.</text>
    <text x="280" y="915" font-size="15" fill="#253d35">Dwa sloty najpóźniej od 21:00. Termin musi być przyszły, pon.–pt.</text>
