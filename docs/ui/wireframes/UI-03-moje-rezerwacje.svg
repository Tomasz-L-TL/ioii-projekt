    <text x="280" y="777" font-size="15" fill="#253d35">Projekt odmowy: termin jest już rozpoczęty lub nie należy do Ciebie.</text>
    <text x="280" y="803" font-size="15" fill="#253d35">Stan pusty: brak rezerwacji w wybranej kategorii.</text>
