    <text x="280" y="558" font-size="15" fill="#253d35">Projekt potwierdzenia: anulować własny przyszły termin A-101, 20.10?</text>
    <text x="280" y="584" font-size="15" fill="#253d35">Zwolnienie dwóch slotów; historia zostanie zachowana w docelowym systemie.</text>
